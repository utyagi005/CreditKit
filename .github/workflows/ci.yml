name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build types
        run: pnpm --filter @creditkit/types build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build backend
        run: pnpm --filter @creditkit/backend build

      - name: Build frontend
        run: pnpm --filter @creditkit/frontend build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Analytics syntax check
        run: python -m py_compile analytics/main.py
